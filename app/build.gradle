// App module build script.
// Configures Android build settings, dependencies, and test runner.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'uk.org.baker_net.gpswaypoint'
    compileSdk = 34

    defaultConfig {
        applicationId = "uk.org.baker_net.gpswaypoint"
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        viewBinding = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    // AndroidX core libraries
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Lifecycle (ViewModel + LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Activity result APIs
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // DocumentFile for SAF (Storage Access Framework) GPX picking
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // MapLibre Native: map view used by MapActivity. Supplies the pannable/
    // zoomable map surface, OSM raster tile rendering, and the GeoJSON
    // source/layer overlays used to draw the planned route, elapsed route,
    // and current location. Actively maintained (unlike osmdroid, which was
    // archived by its maintainers in November 2024 with no further releases).
    implementation 'org.maplibre.gl:android-sdk:13.5.1'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    testImplementation("xmlpull:xmlpull:1.1.3.1")
    testImplementation("xpp3:xpp3:1.1.4c")

    // Android instrumentation tests (not required by spec but included for completeness)
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
